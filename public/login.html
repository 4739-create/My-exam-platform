<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in | Exit Exam Prep</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site">
    <div class="container nav-wrap" id="nav"></div>
  </header>

  <main class="container">
    <div class="card form-narrow">
      <h1>Log in</h1>
      <p class="muted">Use the phone number and password you registered with.</p>
      <div id="alertBox"></div>
      <form id="loginForm" novalidate>
        <label for="phone">Phone number</label>
        <input id="phone" name="phone" type="tel" placeholder="0912345678" autocomplete="tel" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <p class="mt">
          <button class="btn btn-block" type="submit">Log in</button>
        </p>
      </form>
      <p class="center small mt">New here? <a href="register.html">Create an account</a></p>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
