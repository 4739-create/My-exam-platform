<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mock Exam | Exit Exam Prep</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site">
    <div class="container nav-wrap" id="nav"></div>
  </header>

  <main class="container">
    <section class="section">
      <h1 id="examTitle">Mock Examination</h1>
      <div id="alertBox"></div>

      <div id="introCard" class="card">
        <p class="muted">Loading examination...</p>
      </div>

      <div id="examArea" class="hidden">
        <div class="timer" id="timer">Time left: --:--</div>
        <form id="mockForm">
          <div id="questions"></div>
          <p class="mt">
            <button class="btn btn-lg" type="submit" id="submitBtn">Submit examination</button>
          </p>
        </form>
      </div>

      <div id="resultArea" class="hidden">
        <div class="card center mb">
          <h2 id="scoreText">Your score</h2>
          <p class="muted" id="scoreSub"></p>
          <p class="mt">
            <a class="btn" href="dashboard.html">Back to dashboard</a>
            <a class="btn btn-ghost" href="index.html">Browse more packages</a>
          </p>
        </div>
        <h2>Answer review</h2>
        <div id="review"></div>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script src="js/mock.js"></script>
</body>
</html>
