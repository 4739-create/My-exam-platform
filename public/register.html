<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account | Exit Exam Prep</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site">
    <div class="container nav-wrap" id="nav"></div>
  </header>

  <main class="container">
    <div class="card form-narrow">
      <h1>Create your account</h1>
      <p class="muted">Register with your full name, phone number and department.</p>
      <div id="alertBox"></div>
      <form id="registerForm" novalidate>
        <label for="fullName">Full name</label>
        <input id="fullName" name="fullName" type="text" placeholder="e.g. Abebe Kebede" autocomplete="name" required />

        <label for="phone">Phone number</label>
        <input id="phone" name="phone" type="tel" placeholder="0912345678" autocomplete="tel" required />
        <p class="form-note">Use the phone number linked to your Telebirr account.</p>

        <label for="department">Department</label>
        <input id="department" name="department" type="text" list="departments" placeholder="e.g. Computer Science" required />
        <datalist id="departments">
          <option value="Computer Science"></option>
          <option value="Nursing"></option>
          <option value="Accounting and Finance"></option>
          <option value="Law"></option>
          <option value="Civil Engineering"></option>
          <option value="Public Health"></option>
          <option value="Electrical Engineering"></option>
          <option value="Management"></option>
        </datalist>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="At least 6 characters" autocomplete="new-password" required />

        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" required />

        <p class="mt">
          <button class="btn btn-block" type="submit">Create account</button>
        </p>
      </form>
      <p class="center small mt">Already registered? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
